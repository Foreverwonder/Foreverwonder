<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="750" fill="#0f172a"/>
  <rect x="40" y="30" width="560" height="150" rx="16" fill="#1e293b" stroke="#334155"/><text x="68" y="82" font-size="30">🧭</text><text x="118" y="84" font-size="20" font-weight="700" fill="#e2e8f0">ai-projects-exploration</text><text x="68" y="122" font-size="15" fill="#94a3b8">两年 149 个 AI 项目的数据画像，只读扫出来再画成图</text><text x="68" y="154" font-size="12.5" fill="#22d3ee">→ github.com/Foreverwonder/ai-projects-exploration</text><rect x="630" y="30" width="560" height="150" rx="16" fill="#1e293b" stroke="#334155"/><text x="658" y="82" font-size="30">📖</text><text x="708" y="84" font-size="20" font-weight="700" fill="#e2e8f0">conversations-with-god-sk…</text><text x="658" y="122" font-size="15" fill="#94a3b8">与神对话全五卷蒸馏成 20 个可执行 skill，忠实原著不删减</text><text x="658" y="154" font-size="12.5" fill="#22d3ee">→ github.com/Foreverwonder/conversations-with-god-skill</text><rect x="40" y="210" width="560" height="150" rx="16" fill="#1e293b" stroke="#334155"/><text x="68" y="262" font-size="30">🔮</text><text x="118" y="264" font-size="20" font-weight="700" fill="#e2e8f0">sihe-paipan</text><text x="68" y="302" font-size="15" fill="#94a3b8">四派合一排盘：八字 + 紫微 + 奇门 + 六爻，一个时间四盘齐排</text><text x="68" y="334" font-size="12.5" fill="#22d3ee">→ github.com/Foreverwonder/sihe-paipan</text><rect x="630" y="210" width="560" height="150" rx="16" fill="#1e293b" stroke="#334155"/><text x="658" y="262" font-size="30">📈</text><text x="708" y="264" font-size="20" font-weight="700" fill="#e2e8f0">DestinyMatrix</text><text x="658" y="302" font-size="15" fill="#94a3b8">人生 K 线图 —— 把命理走势画成一只股票的走势</text><text x="658" y="334" font-size="12.5" fill="#22d3ee">→ github.com/Foreverwonder/DestinyMatrix</text><rect x="40" y="390" width="560" height="150" rx="16" fill="#1e293b" stroke="#334155"/><text x="68" y="442" font-size="30">📰</text><text x="118" y="444" font-size="20" font-weight="700" fill="#e2e8f0">daily-finance-digest</text><text x="68" y="482" font-size="15" fill="#94a3b8">Bloomberg + Reuters 抓取 → 亲自翻译 → 卡片式 HTML → 飞书归档</text><text x="68" y="514" font-size="12.5" fill="#22d3ee">→ github.com/Foreverwonder/daily-finance-digest</text><rect x="630" y="390" width="560" height="150" rx="16" fill="#1e293b" stroke="#334155"/><text x="658" y="442" font-size="30">⚙️</text><text x="708" y="444" font-size="20" font-weight="700" fill="#e2e8f0">governance-circuit</text><text x="658" y="482" font-size="15" fill="#94a3b8">给 AI skill 装治理电路：契约、路由、证据、审查，四样缺一不可</text><text x="658" y="514" font-size="12.5" fill="#22d3ee">→ github.com/Foreverwonder/governance-circuit</text><rect x="40" y="570" width="560" height="150" rx="16" fill="#1e293b" stroke="#334155"/><text x="68" y="622" font-size="30">🩺</text><text x="118" y="624" font-size="20" font-weight="700" fill="#e2e8f0">jev-disk-mvp</text><text x="68" y="662" font-size="15" fill="#94a3b8">只读磁盘体检 —— 每个文件夹删不删，让类型化判断自己报把握几成</text><text x="68" y="694" font-size="12.5" fill="#22d3ee">→ github.com/Foreverwonder/jev-disk-mvp</text><rect x="630" y="570" width="560" height="150" rx="16" fill="#1e293b" stroke="#334155"/><text x="658" y="622" font-size="30">🔯</text><text x="708" y="624" font-size="20" font-weight="700" fill="#e2e8f0">dualring-365</text><text x="658" y="662" font-size="15" fill="#94a3b8">一年 365 天，一天一张双环择时盘，离线算完压成一个 HTML</text><text x="658" y="694" font-size="12.5" fill="#22d3ee">→ github.com/Foreverwonder/dualring-365</text>
</svg>
